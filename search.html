<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>搜索 | JowJo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0e0e0e;color:#f2f2f2;font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8;min-height:100vh;}
a{color:inherit;text-decoration:none;}
.top-nav{position:fixed;top:0;left:0;right:0;z-index:10;background:linear-gradient(to bottom,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 100%);}
.nav-inner{display:flex;justify-content:center;align-items:flex-start;max-width:1100px;margin:0 auto;padding:30px 24px 16px;font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}
.nav-inner .nav-item{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;color:#fff;white-space:nowrap;border-left:1px solid rgba(255,255,255,.32);}
.nav-inner .nav-item:first-child{border-left:none;}
.nav-inner .label{font-size:clamp(18px,2.2vw,25px);letter-spacing:1.5px;opacity:.82;text-shadow:0 1px 8px rgba(0,0,0,.55);transition:opacity .25s,text-shadow .25s;}
.nav-inner .nav-item:hover .label{opacity:1;text-shadow:0 0 14px rgba(255,255,255,.7);}
.nav-inner .sub{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:8px;font-size:12px;letter-spacing:1px;color:rgba(255,255,255,.82);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;}
.nav-inner .nav-item:hover .sub{opacity:1;}
@media(max-width:600px){.nav-inner{padding:14px 8px 10px;max-width:none;}.nav-inner .label{font-size:12px;letter-spacing:.3px;}.nav-inner .sub{font-size:9px;margin-top:4px;}}

.wrap{max-width:980px;margin:0 auto;padding:150px 36px 60px;}
.page-title{font-size:clamp(34px,6vw,56px);text-align:center;font-weight:700;letter-spacing:2px;margin-bottom:6px;}
.page-sub{text-align:center;opacity:.6;font-size:14px;letter-spacing:3px;margin-bottom:34px;}

/* 搜索框 */
.search-box{position:relative;max-width:640px;margin:0 auto 10px;}
.search-box input{width:100%;background:#151515;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:16px 52px 16px 26px;color:#f2f2f2;font-size:17px;font-family:inherit;outline:none;transition:border-color .25s,box-shadow .25s;}
.search-box input::placeholder{color:rgba(255,255,255,.35);}
.search-box input:focus{border-color:#9fc6ff;box-shadow:0 0 0 3px rgba(159,198,255,.15);}
.search-box .icon{position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.5;pointer-events:none;}
.search-hint{text-align:center;font-size:13px;opacity:.45;margin-bottom:30px;}

/* 结果 */
.count{text-align:center;font-size:13px;opacity:.6;margin-bottom:14px;min-height:20px;}
.result{display:block;padding:20px 4px;border-bottom:1px solid rgba(255,255,255,.09);transition:background .2s;}
.result:hover{background:rgba(255,255,255,.03);}
.result .top{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.result .cat{font-size:11px;padding:2px 10px;border-radius:20px;letter-spacing:1px;}
.cat-ai{background:rgba(159,198,255,.15);color:#9fc6ff;border:1px solid rgba(159,198,255,.35);}
.cat-skill{background:rgba(126,217,159,.13);color:#7ed99f;border:1px solid rgba(126,217,159,.3);}
.result .date{font-size:12px;opacity:.45;}
.result h3{font-size:19px;font-weight:500;margin-bottom:6px;transition:color .2s;}
.result:hover h3{color:#9fc6ff;}
.result p{font-size:14px;opacity:.65;line-height:1.7;margin-bottom:8px;}
.result .tags span{display:inline-block;font-size:11px;padding:2px 9px;margin:0 5px 4px 0;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:rgba(255,255,255,.7);}
.result mark{background:#ffe08a;color:#111;padding:0 2px;border-radius:3px;font-weight:500;}
.empty,.hint{text-align:center;padding:46px 0;font-size:14px;opacity:.5;}
.foot{text-align:center;padding:30px 0 44px;font-size:12px;opacity:.5;}

/* 导航右上角搜索入口（跟随"关于"平齐） */
.nav-search{display:flex;align-items:center;justify-content:center;color:#fff;opacity:.8;transition:opacity .25s,transform .25s;filter:drop-shadow(0 1px 6px rgba(0,0,0,.6));align-self:center;margin-left:10px;}
.nav-search:hover{opacity:1;transform:scale(1.1);}
@media(max-width:600px){.nav-search{margin-left:4px;}.nav-search svg{width:17px;height:17px;}.top-nav .nav-item{flex:0 1 auto;min-width:auto;}.nav-inner{gap:14px;}}
</style>
</head>
<body>
  <nav class="top-nav">
    <div class="nav-inner">
      <a href="ai-sharing.html" class="nav-item"><span class="label">AI经验</span><span class="sub">日常中的一些AI经验分享</span></a>
      <a href="skills.html" class="nav-item"><span class="label">SKILLS</span><span class="sub">一些好用的Skills</span></a>
      <a href="works.html" class="nav-item"><span class="label">作品</span><span class="sub">我做过的一些项目与案例</span></a>
      <a href="services.html" class="nav-item"><span class="label">商业合作</span><span class="sub">JowJo也许可以解决你的一些问题</span></a>
      <a href="about.html" class="nav-item"><span class="label">关于</span><span class="sub">关于JowJo与超认真工作室</span></a>
    </div>
  </nav>

  <div class="wrap">
    <div class="page-title">搜索</div>
    <div class="page-sub">SEARCH · 找文章、找 Skills</div>

    <div class="search-box">
      <input id="kw" type="text" placeholder="输入关键词或拼音，比如：创作、智能体、lidan…" autocomplete="off"/>
      <span class="icon">⌕</span>
    </div>
    <div class="search-hint">支持标题 / 摘要 / 标签 / 栏目名 / 拼音（lidan→李诞）匹配</div>

    <div class="count" id="count"></div>
    <div id="list"></div>
  </div>

  <div class="foot">Copyright by <a href="index.html" style="color:inherit;text-decoration:underline;">超认真工作室</a></div>

<script>
(function () {
  var input = document.getElementById('kw');
  var list = document.getElementById('list');
  var count = document.getElementById('count');
  var data = [];

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function hl(text, kw) {
    var s = esc(text);
    if (!kw) return s;
    var re = new RegExp('(' + kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return s.replace(re, '<mark>$1</mark>');
  }

  function render(q) {
    var kw = (q || '').trim().toLowerCase();
    if (!kw) {
      count.textContent = '';
      list.innerHTML = '<div class="hint">输入关键词开始搜索 🔍<br/>试试：创作 · 智能体 · 读书 · 周鸿祎 · 效率</div>';
      return;
    }
    var rs = data.filter(function (d) {
      var hay = (d.title + ' ' + (d.desc || '') + ' ' + (d.cat || '') + ' ' + (d.tags || []).join(' ') + ' ' + (d.py || '')).toLowerCase();
      return hay.indexOf(kw) !== -1;
    });
    count.textContent = '共 ' + rs.length + ' 条结果';
    if (!rs.length) {
      list.innerHTML = '<div class="empty">没找到「' + esc(q) + '」相关的内容<br/>换个词试试，或从上方导航直接逛</div>';
      return;
    }
    list.innerHTML = rs.map(function (d) {
      var catClass = d.cat === 'SKILLS' ? 'cat-skill' : 'cat-ai';
      var tags = (d.tags || []).map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('');
      return '<a class="result" href="' + esc(d.url) + '">' +
        '<div class="top"><span class="cat ' + catClass + '">' + esc(d.cat) + '</span><span class="date">' + esc(d.date) + '</span></div>' +
        '<h3>' + hl(d.title, kw) + '</h3>' +
        '<p>' + hl(d.desc, kw) + '</p>' +
        (tags ? '<div class="tags">' + tags + '</div>' : '') +
        '</a>';
    }).join('');
  }

  input.addEventListener('input', function (e) { render(e.target.value); });

  fetch('search-index.json').then(function (r) { return r.json(); }).then(function (d) {
    data = d;
    render(input.value);
  }).catch(function () {
    list.innerHTML = '<div class="empty">索引加载失败，请稍后刷新</div>';
  });
})();
</script>
</body>
</html>
