<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JowJow</title>
  <meta name="description" content="JowJow — AI 探索者的个人工作站。探索 AI 改变生活的每一刻。" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      color: #fff;
    }

    /* 全屏视频铺底 */
    .video-wrap { position: fixed; inset: 0; z-index: 0; }
    #bg {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 暗角遮罩：让文字在任何画面下都看得清 */
    .overlay {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background:
        radial-gradient(ellipse at center, rgba(0,0,0,0) 38%, rgba(0,0,0,0.55) 100%),
        linear-gradient(to top, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0) 30%);
    }

    /* 左上角品牌 */
    .brand {
      position: fixed; top: 26px; left: 30px; z-index: 2;
      font-weight: 700; font-size: 20px; letter-spacing: 1px;
      text-shadow: 0 2px 14px rgba(0,0,0,.5);
    }
    .brand .dot { opacity: .9; }

    /* 右上角 slogan（从原左下角移上来，右对齐） */
    .slogan {
      position: fixed; right: 30px; top: 26px; z-index: 2;
      max-width: 70vw;
      text-align: right;
      text-shadow: 0 2px 16px rgba(0,0,0,.6);
    }
    .slogan .big {
      display: block;
      font-size: clamp(22px, 4.2vw, 42px);
      font-weight: 700; line-height: 1.18; letter-spacing: .5px;
    }
    .slogan .sub {
      display: block; margin-top: 10px;
      font-size: 13px; letter-spacing: 3px; opacity: .72;
    }

    /* 极简底部社媒（居中，保留联系入口） */
    .social {
      position: fixed; left: 50%; transform: translateX(-50%); bottom: 46px; z-index: 2;
      display: flex; gap: 18px;
    }
    .social a {
      color: #fff; opacity: .7; font-size: 12px; letter-spacing: 1px;
      text-decoration: none; transition: opacity .2s;
      text-shadow: 0 1px 8px rgba(0,0,0,.6);
    }
    .social a:hover { opacity: 1; }

    /* 最底部版权 */
    .copyright {
      position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; z-index: 2;
      font-size: 11px; letter-spacing: 1px; opacity: .5;
      text-shadow: 0 1px 6px rgba(0,0,0,.6);
    }

    @media (max-width: 600px) {
      .brand { top: 18px; left: 18px; font-size: 17px; }
      .slogan { right: 18px; top: 18px; }
      .slogan .big { font-size: 20px; }
      .slogan .sub { font-size: 11px; letter-spacing: 2px; }
      .social { bottom: 40px; gap: 14px; }
      .copyright { bottom: 14px; }
    }
  </style>
</head>
<body>
  <div class="video-wrap">
    <video id="bg" autoplay muted loop playsinline preload="auto">
      <source src="media/hero.mp4" type="video/mp4" />
      你的浏览器不支持视频播放。
    </video>
  </div>

  <div class="overlay"></div>

  <div class="brand">JowJow<span class="dot">.</span></div>

  <div class="slogan">
    <span class="big">探索 AI 改变生活的每一刻</span>
    <span class="sub">JOWJOW · AI EXPLORER</span>
  </div>

  <div class="social">
    <a href="https://xhslink.com/m/A0GnUQ9rw0U" target="_blank" rel="noopener">小红书</a>
    <a href="https://douyin.com/user/MS4wLjABAAAAreuw3cVEK6Hp5cO9UyTVRpkyAs0yGbAmmy21T5seUypb1Mfq9Bc_qUqmY2ecqQWi" target="_blank" rel="noopener">抖音</a>
    <a href="https://b23.tv/EZxcvcF" target="_blank" rel="noopener">B站</a>
    <a href="mailto:jowjowork@163.com">邮箱</a>
  </div>

  <div class="copyright">Copyright by 超认真工作室</div>
</body>
</html>
