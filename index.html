<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JowJo</title>
  <meta name="description" content="JowJo — AI 探索者的个人工作站。探索 AI 改变生活的每一刻。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      color: #fff;
    }

    /* 全屏视频铺底 */
    .video-wrap { position: fixed; inset: 0; z-index: 0; }
    #bg {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 暗角遮罩：让文字在任何画面下都看得清 */
    .overlay {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background:
        radial-gradient(ellipse at center, rgba(0,0,0,0) 38%, rgba(0,0,0,0.55) 100%),
        linear-gradient(to top, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0) 30%);
    }

    /* 中央品牌 + 下方 slogan 垂直居中组 */
    .center {
      position: fixed; top: 50%; left: 50%; z-index: 2;
      transform: translate(-50%, -50%);
      text-align: center;
      width: 92vw;
    }

    /* 中央品牌大字（Allura 极细优雅花体 + 弱辉光） */
    .brand {
      font-family: 'Allura', "Brush Script MT", "Snell Roundhand", cursive;
      font-weight: 400;
      font-size: clamp(76px, 13vw, 134px);
      letter-spacing: .02em;
      white-space: nowrap;
      text-shadow:
        0 0 12px rgba(255,255,255,.07),
        0 2px 18px rgba(0,0,0,.45);
    }
    .brand .dot { opacity: .85; }

    /* slogan：移至品牌正下方、斜体、宽度略宽于品牌（约 7 -> 9 字符感） */
    .slogan {
      margin-top: .14em;
      font-style: italic;
      transform: scaleX(1.18);
      transform-origin: center;
      text-shadow: 0 2px 16px rgba(0,0,0,.6);
    }
    .slogan .big {
      display: block;
      font-size: clamp(18px, 3.6vw, 30px);
      font-weight: 400; line-height: 1.2; letter-spacing: .5px;
    }
    .slogan .sub {
      display: block; margin-top: 8px;
      font-size: 12px; letter-spacing: 3px; opacity: .72;
    }

    /* 极简底部社媒（居中，保留联系入口） */
    .social {
      position: fixed; left: 50%; transform: translateX(-50%); bottom: 46px; z-index: 2;
      display: flex; gap: 18px;
    }
    .social a {
      color: #fff; opacity: .7; font-size: 12px; letter-spacing: 1px;
      text-decoration: none; transition: opacity .2s;
      text-shadow: 0 1px 8px rgba(0,0,0,.6);
    }
    .social a:hover { opacity: 1; }

    /* 最底部版权 */
    .copyright {
      position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; z-index: 2;
      font-size: 11px; letter-spacing: 1px; opacity: .5;
      text-shadow: 0 1px 6px rgba(0,0,0,.6);
    }

    /* 顶部居中导航（呼应影视飓风式，但只保留中间文字，无 logo/头像） */
    .top-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; justify-content: center; align-items: center;
      gap: clamp(24px, 4vw, 48px);
      padding: 24px 20px;
      background: linear-gradient(to bottom, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 100%);
    }
    .top-nav a {
      color: #fff; opacity: .72;
      font-size: 14px; letter-spacing: 1px;
      text-decoration: none; white-space: nowrap;
      text-shadow: 0 1px 8px rgba(0,0,0,.55);
      transition: opacity .2s, transform .2s;
    }
    .top-nav a:hover { opacity: 1; transform: translateY(-1px); }

    @media (max-width: 600px) {
      .top-nav { padding: 18px 14px; gap: 18px; }
      .top-nav a { font-size: 12px; letter-spacing: .5px; }
      .brand { font-size: clamp(40px, 16vw, 72px); }
      .slogan { transform: scaleX(1.12); }
      .slogan .big { font-size: 18px; }
      .slogan .sub { font-size: 11px; letter-spacing: 2px; }
      .social { bottom: 40px; gap: 14px; }
      .copyright { bottom: 14px; }
    }
  </style>
</head>
<body>

    </div>
  </div>

  </div>

  <div class="copyright">Copyright by 超认真工作室</div>
</body>
</html>
