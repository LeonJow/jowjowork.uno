    <h1>关于生活</h1>
    <div class="meta">2026.11.12 · 1 分钟读完</div>

    <div class="body">
      <p><b>是生活，不是生存。</b></p>

      <p>先保证这四件：</p>

      <ol class="order">
        <li>住</li>
        <li>吃</li>
        <li>行</li>
        <li>衣</li>
      </ol>

      <p>这四件是底线。底线之上，剩下的才叫生活——不然只是活着。</p>

      <div class="empty" style="margin-top:26px">
        <b>这一篇还能补</b>
        每一样我具体怎么处理的：住哪儿、怎么吃、出行方式、衣柜里有什么。想清楚一条写一条。
      </div>
